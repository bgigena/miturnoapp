<div class="login-container">
  <h2>{{ isLoginMode ? 'Iniciar Sesión' : 'Registrarse' }}</h2>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form [formGroup]="isLoginMode ? loginForm : registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" formControlName="password" required>
    </div>

    <div class="form-group" *ngIf="!isLoginMode">
        <label for="role">Soy:</label>
        <select id="role" formControlName="role">
            <option value="cliente">Cliente</option>
            <option value="proveedor">Proveedor</option>
        </select>
    </div>

    <button type="submit" [disabled]="(isLoginMode ? loginForm.invalid : registerForm.invalid)">
      {{ isLoginMode ? 'Ingresar' : 'Registrarse' }}
    </button>
  </form>

  <p>
    {{ isLoginMode ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
    <a href="javascript:void(0)" (click)="toggleMode()">
      {{ isLoginMode ? 'Regístrate' : 'Inicia Sesión' }}
    </a>
  </p>
</div>
