<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
    
    <!-- Header -->
    <div class="text-center">
      <h2 class="mt-2 text-3xl font-extrabold text-gray-900 tracking-tight">
        {{ isLoginMode ? 'Bienvenido a MiTurno' : 'Crear una Cuenta' }}
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        {{ isLoginMode ? 'Ingresa tus credenciales para acceder' : 'Regístrate para empezar a gestionar tus turnos' }}
      </p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-4">
      <p-message severity="error" [text]="errorMessage" styleClass="w-full"></p-message>
    </div>

    <!-- Form -->
    <form class="mt-8 space-y-6" [formGroup]="isLoginMode ? loginForm : registerForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4 rounded-md shadow-sm">
        
        <!-- Email Input -->
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input 
            pInputText 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="ejemplo@correo.com" 
            class="w-full"
            [ngClass]="{'ng-invalid ng-dirty': (isLoginMode ? loginForm : registerForm).get('email')?.invalid && (isLoginMode ? loginForm : registerForm).get('email')?.touched}"
          />
        </div>

        <!-- Password Input -->
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm font-medium text-gray-700">Contraseña</label>
          <p-password 
            id="password" 
            formControlName="password" 
            [toggleMask]="true" 
            [feedback]="!isLoginMode"
            placeholder="••••••••" 
            styleClass="w-full"
            inputStyleClass="w-full">
          </p-password>
        </div>

        <!-- Role Select (Only for Registration) -->
        <div *ngIf="!isLoginMode" class="flex flex-col gap-2 pt-2">
          <label for="role" class="text-sm font-medium text-gray-700">Tipo de Cuenta</label>
          <p-select 
            id="role"
            [options]="roles" 
            formControlName="role" 
            optionLabel="label" 
            optionValue="value"
            placeholder="Selecciona un rol" 
            styleClass="w-full">
          </p-select>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <p-button 
          type="submit" 
          [label]="isLoginMode ? 'Iniciar Sesión' : 'Registrarse'" 
          [disabled]="(isLoginMode ? loginForm.invalid : registerForm.invalid)"
          [loading]="isLoading"
          styleClass="w-full p-button-primary p-3 font-semibold text-lg rounded-xl">
        </p-button>
      </div>
    </form>

    <!-- Toggle Mode Link -->
    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">
        {{ isLoginMode ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
        <button 
          type="button" 
          (click)="toggleMode()" 
          class="font-semibold text-blue-600 hover:text-blue-500 transition-colors focus:outline-none">
          {{ isLoginMode ? 'Regístrate aquí' : 'Inicia Sesión' }}
        </button>
      </p>
    </div>

  </div>
</div>
