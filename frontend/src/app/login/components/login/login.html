<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Logo y título -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center size-16 bg-white rounded-2xl shadow-lg mb-4">
        <i class="pi pi-clock text-4xl text-indigo-600"></i>
      </div>
      <h1 class="text-4xl font-bold text-white mb-2">TurnosApp</h1>
      <p class="text-indigo-100">
        Gestión profesional de turnos para peluquerías
      </p>
    </div>

    <!-- Card de login -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">
        {{ isLoginMode ? 'Iniciar Sesión' : 'Crear una Cuenta' }}
      </h2>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
        {{ errorMessage }}
      </div>

      <form [formGroup]="isLoginMode ? loginForm : registerForm" (ngSubmit)="onSubmit()" class="space-y-4 mb-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>
          <div class="relative">
            <i class="pi pi-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input
              id="email"
              type="email"
              formControlName="email"
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              [ngClass]="{'border-red-500': (isLoginMode ? loginForm : registerForm).get('email')?.invalid && (isLoginMode ? loginForm : registerForm).get('email')?.touched}"
              placeholder="tu@email.com"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Contraseña
          </label>
          <div class="relative">
            <i class="pi pi-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 z-10"></i>
            <p-password 
              id="password" 
              formControlName="password" 
              [toggleMask]="true" 
              [feedback]="!isLoginMode"
              placeholder="••••••••" 
              styleClass="w-full"
              inputStyleClass="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            </p-password>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="(isLoginMode ? loginForm.invalid : registerForm.invalid) || isLoading"
          class="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors disabled:opacity-50 mt-2"
        >
          <i class="pi pi-sign-in text-lg" *ngIf="!isLoading"></i>
          <i class="pi pi-spin pi-spinner text-lg" *ngIf="isLoading"></i>
          {{ isLoading ? "Procesando..." : (isLoginMode ? "Iniciar Sesión" : "Registrarse") }}
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">
            O continuar con Google
          </span>
        </div>
      </div>

      <div class="flex justify-center mt-4">
        <asl-google-signin-button type="standard" size="large" [width]="300"></asl-google-signin-button>
      </div>

      <!-- Toggle Mode Link -->
      <div class="text-center mt-6">
        <p class="text-sm text-gray-600">
          {{ isLoginMode ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
          <button 
            type="button" 
            (click)="toggleMode()" 
            class="font-semibold text-indigo-600 hover:text-indigo-500 transition-colors focus:outline-none">
            {{ isLoginMode ? 'Regístrate aquí' : 'Inicia Sesión' }}
          </button>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-white/80 text-sm mt-6">
      © 2026 TurnosApp. Sistema profesional de gestión de turnos.
    </p>
  </div>
</div>
