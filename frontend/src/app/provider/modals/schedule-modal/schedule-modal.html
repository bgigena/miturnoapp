<p-dialog 
    header="Excepciones de Horario" 
    [visible]="isModalVisible()" 
    (visibleChange)="!$event ? closeModal() : null" 
    [modal]="true" 
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '800px', 'max-height': '90vh' }"
    styleClass="p-fluid">
    
    <ng-template pTemplate="header">
        <div class="flex flex-col">
            <span class="text-xl font-bold text-gray-900">Días de Excepción / Cierres</span>
            <span class="text-sm text-gray-500 mt-1">Configura feriados o días en los que no atenderás.</span>
        </div>
    </ng-template>

    <div class="pt-4">
        <!-- Calendar Header Navigation -->
        <div class="flex justify-between items-center mb-4 p-3 bg-gray-50 rounded-xl border border-gray-200">
            <p-button 
                label="Hoy" 
                size="small" 
                [text]="true" 
                severity="info" 
                (onClick)="goToToday()">
            </p-button>
            <div class="flex items-center gap-2">
                <p-button icon="pi pi-chevron-left" [rounded]="true" [text]="true" severity="secondary" (onClick)="prevMonth()"></p-button>
                <h5 class="m-0 text-lg font-bold text-gray-800 min-w-[150px] text-center capitalize">{{ viewDate() | date:'MMMM yyyy' }}</h5>
                <p-button icon="pi pi-chevron-right" [rounded]="true" [text]="true" severity="secondary" (onClick)="nextMonth()"></p-button>
            </div>
        </div>
        
        <!-- The Angular Calendar View -->
        <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
            <mwl-calendar-month-view 
                [viewDate]="viewDate()" 
                (viewDateChange)="setViewDate($event)"
                [events]="calendarEvents()" 
                (dayClicked)="dayClicked($event)" 
                (eventClicked)="removeException($event.event.id)" 
                [activeDayIsOpen]="activeDay()"
                [activeDay]="day()!" 
                [refresh]="refresh" 
                [weekendDays]="[0,6]"> 
            </mwl-calendar-month-view>
        </div>

        <!-- Add Exception Form -->
        @if (showGlobalForm() && newExceptionDate) {
        <div class="mt-6 p-5 border border-indigo-200 rounded-xl bg-indigo-50/50 shadow-sm animate-fade-in">
            <h5 class="font-semibold mb-3 text-indigo-800">
                Programar cierre: <span class="font-bold">{{ newExceptionDate | date:'fullDate' }}</span>
            </h5>

            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    pInputText 
                    [(ngModel)]="newExceptionReason" 
                    name="newExceptionReason"
                    placeholder="Ej: Feriado Nacional, Vacaciones..."
                    class="flex-grow">

                <div class="flex gap-2">
                    <p-button 
                        label="Cancelar" 
                        [text]="true" 
                        severity="secondary" 
                        (onClick)="cancelNewException()">
                    </p-button>
                    <p-button 
                        label="Guardar" 
                        icon="pi pi-check" 
                        [disabled]="!newExceptionReason.trim()"
                        (onClick)="addException()">
                    </p-button>
                </div>
            </div>
        </div>
        }
    </div>
</p-dialog>
