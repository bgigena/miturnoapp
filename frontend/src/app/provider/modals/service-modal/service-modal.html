<p-dialog 
    header="Gestión de Servicio" 
    [visible]="isModalVisible()" 
    (visibleChange)="!$event ? closeModal() : null" 
    [modal]="true" 
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '450px' }"
    styleClass="p-fluid">
    
    <ng-template pTemplate="header">
        <div class="flex flex-col">
            <span class="text-xl font-bold text-gray-900">Gestión de Servicio</span>
            <span class="text-sm text-gray-500 mt-1">Añade o edita los servicios que ofreces.</span>
        </div>
    </ng-template>

    <form (ngSubmit)="saveService()" class="mt-4 space-y-5">
        
        <!-- Nombre -->
        <div class="flex flex-col gap-2">
            <label for="serviceName" class="text-sm font-medium text-gray-700">Nombre del Servicio</label>
            <input 
                pInputText 
                id="serviceName" 
                [(ngModel)]="service.name" 
                name="name" 
                placeholder="Ej: Corte Clásico" 
                required 
                autofocus />
        </div>
        
        <div class="flex gap-4">
            <!-- Duración -->
            <div class="flex flex-col gap-2 flex-1">
                <label for="duration" class="text-sm font-medium text-gray-700">Duración</label>
                <p-inputNumber 
                    inputId="duration" 
                    [(ngModel)]="service.duration" 
                    name="duration" 
                    suffix=" min" 
                    [min]="5" 
                    [step]="5" 
                    [showButtons]="true">
                </p-inputNumber>
            </div>

            <!-- Precio -->
            <div class="flex flex-col gap-2 flex-1">
                <label for="price" class="text-sm font-medium text-gray-700">Precio Total</label>
                <p-inputNumber 
                    inputId="price" 
                    [(ngModel)]="service.price" 
                    name="price" 
                    mode="currency" 
                    currency="ARS" 
                    locale="es-AR" 
                    [min]="0">
                </p-inputNumber>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
            <p-button 
                label="Cancelar" 
                icon="pi pi-times" 
                [text]="true" 
                severity="secondary" 
                (onClick)="closeModal()">
            </p-button>
            <p-button 
                type="submit" 
                label="Guardar Servicio" 
                icon="pi pi-check" 
                [disabled]="!service.name">
            </p-button>
        </div>
    </form>
</p-dialog>
