@if(isModalVisible()){
<div id="modal-servicios" 
     class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
    
    <div class="bg-white card w-full max-w-lg">
        
        <h3 class="text-2xl font-bold mb-4">Gestión de Servicios</h3>
        <p class="text-sm text-gray-600 mb-6">Añade o edita los servicios que ofreces.</p>
        
        <form (ngSubmit)="saveService()" class="space-y-4">
            
            <div>
                <label for="serviceName" class="block text-sm font-medium text-gray-700">Nombre del Servicio</label>
                <input type="text" id="serviceName" placeholder="Corte Clásico" required
                       class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-2">
            </div>
            
            <div class="flex space-x-4">
                <div class="flex-1">
                    <label for="duration" class="block text-sm font-medium text-gray-700">Duración (min)</label>
                    <input type="number" id="duration" value="45" required
                           class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-2">
                </div>
                <div class="flex-1">
                    <label for="price" class="block text-sm font-medium text-gray-700">Precio Total ($)</label>
                    <input type="number" id="price" value="10000" required
                           class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-2">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700 transition font-medium">
                Guardar Servicio
            </button>
        </form>
        
        <button (click)="closeModal()" class="mt-6 w-full text-gray-600 border border-gray-200 p-2 rounded-xl hover:bg-gray-100 transition">
            Cerrar
        </button>
    </div>
</div>
}
