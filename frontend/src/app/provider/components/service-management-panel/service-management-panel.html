<div class="card" id="servicios-panel">
    <h3 class="text-xl font-semibold text-gray-800 mb-4 flex justify-between items-center">
        Servicios
        <button (click)="openServiceModal()" class="text-sm bg-indigo-100 text-indigo-600 hover:bg-indigo-200 px-3 py-1 rounded-full font-medium transition">
            + Nuevo
        </button>
    </h3>
    <div class="space-y-3">
        
        <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
            <p class="font-medium text-gray-900">Corte Clásico</p>
            <p class="text-sm text-gray-600">Duración: 45 min. | Costo: $10.000</p>
        </div>
        <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
            <p class="font-medium text-gray-900">Tintura Completa</p>
            <p class="text-sm text-gray-600">Duración: 120 min. | Costo: $25.000</p>
        </div>
        <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
            <p class="font-medium text-gray-900">Barbería y Perfilado</p>
            <p class="text-sm text-gray-600">Duración: 30 min. | Costo: $8.000</p>
        </div>
        
    </div>
</div>
<app-service-modal 
    [isModalVisible]="isServiceModalVisible"
    (modalClosed)="closeServiceModal()"
    (serviceSaved)="handleServiceSaved($event)">
</app-service-modal>
