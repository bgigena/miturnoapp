<p-card styleClass="shadow-sm border-round-2xl border-1 border-gray-100 mb-4 h-full">
    <ng-template pTemplate="header">
        <div class="flex justify-between items-center px-4 py-3 border-b border-gray-200">
            <div class="flex items-center gap-2">
                <i class="pi pi-list text-indigo-500 text-xl"></i>
                <h3 class="text-lg font-bold text-gray-800 m-0">Mis Servicios</h3>
            </div>
            <p-button 
                label="Nuevo" 
                icon="pi pi-plus" 
                size="small" 
                [rounded]="true" 
                [outlined]="true" 
                severity="info" 
                (onClick)="openServiceModal()">
            </p-button>
        </div>
    </ng-template>

    <div class="space-y-3 pt-2">
        <!-- Servicio Item -->
        <div class="p-3 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition-colors duration-200 flex justify-between items-center group">
            <div>
                <p class="font-bold text-gray-900 m-0">Corte Clásico</p>
                <div class="flex items-center gap-3 mt-1 text-sm text-gray-500">
                    <span class="flex items-center gap-1"><i class="pi pi-clock text-xs"></i> 45 min</span>
                    <span class="flex items-center gap-1"><i class="pi pi-money-bill text-xs"></i> $10.000</span>
                </div>
            </div>
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary" styleClass="opacity-0 group-hover:opacity-100 transition-opacity"></p-button>
        </div>

        <!-- Servicio Item -->
        <div class="p-3 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition-colors duration-200 flex justify-between items-center group">
            <div>
                <p class="font-bold text-gray-900 m-0">Tintura Completa</p>
                <div class="flex items-center gap-3 mt-1 text-sm text-gray-500">
                    <span class="flex items-center gap-1"><i class="pi pi-clock text-xs"></i> 120 min</span>
                    <span class="flex items-center gap-1"><i class="pi pi-money-bill text-xs"></i> $25.000</span>
                </div>
            </div>
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary" styleClass="opacity-0 group-hover:opacity-100 transition-opacity"></p-button>
        </div>

        <!-- Servicio Item -->
        <div class="p-3 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition-colors duration-200 flex justify-between items-center group">
            <div>
                <p class="font-bold text-gray-900 m-0">Barbería y Perfilado</p>
                <div class="flex items-center gap-3 mt-1 text-sm text-gray-500">
                    <span class="flex items-center gap-1"><i class="pi pi-clock text-xs"></i> 30 min</span>
                    <span class="flex items-center gap-1"><i class="pi pi-money-bill text-xs"></i> $8.000</span>
                </div>
            </div>
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary" styleClass="opacity-0 group-hover:opacity-100 transition-opacity"></p-button>
        </div>
        
    </div>
</p-card>

<app-service-modal 
    [isModalVisible]="isServiceModalVisible"
    (modalClosed)="closeServiceModal()"
    (serviceSaved)="handleServiceSaved($event)">
</app-service-modal>
