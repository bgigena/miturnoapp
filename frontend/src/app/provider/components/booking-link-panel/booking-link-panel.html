<p-card styleClass="shadow-sm border-round-2xl border-1 border-indigo-200 bg-indigo-50/30">
    <div class="flex flex-col items-center text-center">
        <div class="bg-indigo-100 p-3 rounded-full mb-3">
            <i class="pi pi-link text-indigo-600 text-xl"></i>
        </div>
        
        <h3 class="text-lg font-bold text-indigo-900 mb-1">Enlace de Reservas</h3>
        <p class="text-sm text-indigo-700 mb-4">Compartí este link con tus clientes para que agenden solos.</p>
        
        <div #bookingLink class="w-full bg-white border border-indigo-200 p-3 rounded-xl font-mono text-sm text-gray-800 mb-4 shadow-inner truncate">
            miturno.app/pedro-barber
        </div>
        
        <p-button 
            label="Copiar Enlace" 
            icon="pi pi-copy" 
            styleClass="w-full" 
            severity="info"
            (onClick)="copiarEnlace(bookingLink.innerText)">
        </p-button>
    </div>
</p-card>
