<p-card styleClass="shadow-sm border-round-2xl border-1 border-gray-100 mb-4 h-full">
    <ng-template pTemplate="header">
        <div class="flex justify-between items-center px-4 py-3 border-b border-gray-200">
            <div class="flex items-center gap-2">
                <i class="pi pi-calendar text-indigo-500 text-xl"></i>
                <h3 class="text-lg font-bold text-gray-800 m-0">Mi Horario</h3>
            </div>
            <p-button 
                label="Ajustar" 
                icon="pi pi-cog" 
                size="small" 
                [rounded]="true" 
                [outlined]="true" 
                severity="secondary" 
                (onClick)="openScheduleModal()">
            </p-button>
        </div>
    </ng-template>

    <div class="pt-2">
        <p class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3">Horario Habitual</p>
        <div class="space-y-2 mb-6">
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-600 font-medium">Martes a Sábados</span>
                <span class="text-gray-900 font-semibold bg-gray-100 px-2 py-1 rounded">10:00 - 20:00</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-600 font-medium">Domingos y Lunes</span>
                <span class="text-red-600 font-semibold bg-red-50 px-2 py-1 rounded">Cerrado</span>
            </div>
        </div>
        
        <p class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3">Próximas Excepciones</p>
        <div class="space-y-2">
            <!-- Exception Item -->
            <div class="flex justify-between items-center p-3 bg-red-50 border border-red-100 rounded-lg group">
                <div>
                    <p class="text-sm font-bold text-red-800 m-0">21 Noviembre</p>
                    <p class="text-xs text-red-600 mt-1">Cerrado por inventario</p>
                </div>
                <p-button icon="pi pi-times" [text]="true" [rounded]="true" severity="danger" size="small" styleClass="opacity-0 group-hover:opacity-100 transition-opacity"></p-button>
            </div>
        </div>
    </div>
</p-card>

<app-schedule-modal
    [isModalVisible]="isScheduleModalVisible"
    (modalClosed)="closeScheduleModal()">
</app-schedule-modal>
