@if (isModalVisible()) {
<div class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">

    <div class="bg-white card w-full max-w-4xl max-h-[90vh] overflow-y-auto relative"> <button type="button" 
                (click)="closeModal()" 
                class="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full transition z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        
        <section class="pt-4"> <h4 class="text-xl font-semibold mb-4 pb-2">Días de Excepción / Cierres Especiales</h4>

            <div class="flex justify-between items-center mb-4 p-2 bg-gray-50 rounded-md">
                <button (click)="goToToday()" class="text-indigo-600 hover:text-indigo-800 font-medium">Hoy</button>
                <div class="flex items-center">
                    <button (click)="prevMonth()" class="p-1 hover:bg-gray-200 rounded">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                    <h5 class="mx-3 text-lg font-semibold">{{ viewDate() | date:'MMMM yyyy' }}</h5>
                    <button (click)="nextMonth()" class="p-1 hover:bg-gray-200 rounded">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <mwl-calendar-month-view [viewDate]="viewDate()" (viewDateChange)="setViewDate($event)"
                [events]="calendarEvents()" (dayClicked)="dayClicked($event)" (eventClicked)="removeException($event.event.id)" [activeDayIsOpen]="activeDay()"
                [activeDay]="day()!" [refresh]="refresh" [weekendDays]="[0,6]"> 
            </mwl-calendar-month-view>

            @if (showGlobalForm() && newExceptionDate) {
            <div class="mt-4 p-4 border-2 border-dashed border-indigo-200 rounded-lg bg-indigo-50 shadow-md">
                <h5 class="font-semibold mb-3 text-indigo-700">
                    Programar cierre el día: <span class="text-xl">{{ newExceptionDate | date:'fullDate' }}</span>
                </h5>

                <div class="flex space-x-2">
                    <input type="text" [(ngModel)]="newExceptionReason" name="newExceptionReason"
                        placeholder="Razón del cierre (Ej: Feriado, Vacaciones)"
                        class="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">

                    <button type="button" (click)="addException()" [disabled]="!newExceptionReason.trim()"
                        class="p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition disabled:bg-indigo-300">
                        Guardar Cierre
                    </button>

                    <button type="button" (click)="cancelNewException()"
                        class="p-2 text-gray-500 hover:bg-gray-200 rounded-lg">
                        Cancelar
                    </button>
                </div>
            </div>
            }
        </section>

    </div>
</div>
}
