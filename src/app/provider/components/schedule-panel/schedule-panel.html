<div class="card" id="horarios-panel">
    <h3 class="text-xl font-semibold text-gray-800 mb-4 flex justify-between items-center">
        Horario y Excepciones
        <button (click)="openScheduleModal()" class="text-sm bg-indigo-100 text-indigo-600 hover:bg-indigo-200 px-3 py-1 rounded-full font-medium transition">
            Configurar
        </button>
    </h3>
    <p class="text-gray-700 font-medium mb-2">Horario Recurrente:</p>
    <ul class="text-sm text-gray-600 space-y-1">
        <li>**Martes a Sábados:** 10:00h - 20:00h</li>
        <li>**Domingos y Lunes:** Cerrado</li>
    </ul>
    <hr class="my-4">
    <p class="text-gray-700 font-medium mb-2">Próximas Excepciones:</p>
    <div class="space-y-2 text-sm">
        <p class="flex justify-between items-center text-red-600 bg-red-50 p-2 rounded-lg">
            Jueves 21/Nov (Cerrado por inventario)
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
        </p>
    </div>
</div>
<app-schedule-modal
    [isModalVisible]="isScheduleModalVisible"
    (modalClosed)="closeScheduleModal()">
</app-schedule-modal>
